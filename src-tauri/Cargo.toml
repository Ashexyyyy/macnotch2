[package]
name="macnotch"
version="0.1.0"
edition="2021"
[build-dependencies]
tauri-build={version="2",features=[]}
[dependencies]
tauri={version="2",features=[]}
tauri-plugin-autostart="2"
serde={version="1",features=["derive"]}
window-vibrancy="0.5"
[target.'cfg(windows)'.dependencies.windows]
version="0.58"
features=["Media_Control","Foundation","Foundation_Collections","Devices_Radios","Win32_Foundation","Win32_System_Com","Win32_System_Power","Win32_System_Threading","Win32_Media_Audio","Win32_Media_Audio_Endpoints","Win32_UI_WindowsAndMessaging","Win32_Graphics_Dwm"]
[profile.release]
opt-level="s"
lto=true
codegen-units=1
strip=true
