name: Build MacNotch installer
on: [push, workflow_dispatch]
env:
  CARGO_TERM_COLOR: never
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 20}
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with: {workspaces: src-tauri}
      - name: Install
        shell: cmd
        run: npm install > build.log 2>&1
      - name: Icons
        shell: cmd
        run: npx tauri icon app-icon.png >> build.log 2>&1
      - name: Build
        shell: cmd
        run: npx tauri build >> build.log 2>&1
      - name: Show error on summary page
        if: failure()
        shell: pwsh
        run: |
          '### Build error (last 70 lines)' | Out-File $env:GITHUB_STEP_SUMMARY -Append
          '```' | Out-File $env:GITHUB_STEP_SUMMARY -Append
          Get-Content build.log -Tail 70 | Out-File $env:GITHUB_STEP_SUMMARY -Append
          '```' | Out-File $env:GITHUB_STEP_SUMMARY -Append
      - uses: actions/upload-artifact@v4
        with:
          name: MacNotch-installer
          path: src-tauri/target/release/bundle/nsis/*.exe
